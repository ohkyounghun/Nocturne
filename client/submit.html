<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Spot — Nocturne</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Header / Nav -->
<header class="header">
    <a href="index.html" class="logo">NOCTURNE</a>
</header>

<!-- Submit Spot Form -->
<main class="auth-container">
    <h1>Submit a Spot</h1>

    <form class="auth-form" id="submit-form">

        <!-- Title -->
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Spot name" required>

        <!-- Description -->
        <label for="description">Description</label>
        <textarea id="description" rows="4" placeholder="What makes this spot special?" required></textarea>

        <!-- Latitude -->
        <label for="latitude">Latitude</label>
        <input type="number" id="latitude" step="any" placeholder="37.5665" required>

        <!-- Longitude -->
        <label for="longitude">Longitude</label>
        <input type="number" id="longitude" step="any" placeholder="126.9780" required>

        <!-- Tags (comma-separated) -->
        <label for="tags">Tags</label>
        <input type="text" id="tags" placeholder="night, view, quiet (comma-separated)">

        <button type="submit" id="btn-submit">Submit</button>

    </form>

    <p><a href="index.html">Back to map</a></p>

</main>

<!-- Scripts -->
<script type="module" src="js/submitSpot.js"></script>

</body>
</html>
