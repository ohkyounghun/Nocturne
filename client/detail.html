<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Detail — Nocturne</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header / Nav -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo">NOCTURNE</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="bookmarks.html" id="nav-bookmarks" class="nav-link hidden">Bookmarks</a>
        </div>
        <div class="header-right">
            <a href="login.html" id="nav-login" class="nav-link">Login</a>
            <a href="my-spots.html" id="nav-myspots" class="nav-link hidden">My Spots</a>
            <button id="nav-logout" class="hidden">Logout</button>
        </div>
    </header>

    <div class="detail-layout">

        <!-- Left: Gallery + Title + Tags + Description -->
        <aside class="detail-left">
            <div class="gallery-main">
                <img id="gallery-main-img" src="" alt="Spot photo">
            </div>
            <div class="gallery-thumbs" id="gallery-thumbs"></div>
            <div id="gallery-upload-wrap" class="hidden">
                <label class="gallery-upload-btn" for="gallery-file-input">+ Add Photo</label>
                <input type="file" id="gallery-file-input" accept="image/*" multiple class="hidden">
            </div>

            <div class="detail-meta">
                <h1 id="spot-title"></h1>
                <div class="spot-tags">
                    <span id="spot-season"></span>
                    <span id="spot-weather"></span>
                </div>
                <p id="spot-description"></p>
            </div>
        </aside>

        <!-- Right: Map + Address + Actions + Comments -->
        <section class="detail-right">
            <div class="spot-location">
                <div id="spot-map" aria-label="Spot location map"></div>
            </div>
            <p id="spot-address" class="spot-address"></p>

            <div class="spot-actions">
                <button id="btn-like">Like</button>
                <button id="btn-bookmark">Bookmark</button>
                <button id="btn-delete-spot" class="btn--danger hidden">Delete Spot</button>
            </div>

            <div class="detail-comments">
                <h2>Comments</h2>
                <ul id="comment-list"></ul>
                <div class="comment-form">
                    <label for="comment-input" class="hidden">Comment</label>
                    <textarea id="comment-input" placeholder="Add a comment..."></textarea>
                    <button id="btn-comment">Post</button>
                </div>
            </div>
        </section>

    </div>

    <script type="module" src="js/spotDetail.js"></script>

</body>

</html>
