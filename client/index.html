<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturne — Discover Seoul After Dark</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Header / Nav -->
<header class="header">
    <div class="header-left">
        <a href="index.html" class="logo">NOCTURNE</a>
        <a href="about.html" class="nav-link">About</a>
    </div>
    <div class="header-right">
        <a href="bookmarks.html" id="nav-bookmarks" class="nav-link hidden">Bookmarks</a>
        <a href="login.html" id="nav-login" class="nav-link">Login</a>
        <a href="register.html" id="nav-register" class="nav-link hidden">Register</a>
        <button id="nav-logout" class="hidden">Logout</button>
    </div>
</header>

<!-- Map -->
<main>
    <div id="map"></div>
</main>

<!-- Season Filter + Post Spot -->
<section class="filter-bar">
    <button class="filter-btn active" data-season="all">All</button>
    <button class="filter-btn" data-season="spring">Spring</button>
    <button class="filter-btn" data-season="summer">Summer</button>
    <button class="filter-btn" data-season="autumn">Autumn</button>
    <button class="filter-btn" data-season="winter">Winter</button>
    <a href="post-spot.html" id="btn-post-spot" class="filter-btn filter-btn--post hidden">+ Post Spot</a>
</section>

<!-- Spot Card List -->
<section class="spot-list" id="spot-list">
    <!-- spot cards rendered by map.js -->
</section>

<!-- Scripts -->
<!-- Kakao Maps SDK — key loaded dynamically from config.js -->
<script type="module">
    import { KAKAO_MAP_KEY } from './js/config.js';
    const script = document.createElement('script');
    script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_MAP_KEY}&autoload=false`;
    script.onload = () => {
        kakao.maps.load(() => {
            import('./js/map.js');
        });
    };
    document.head.appendChild(script);
</script>

<!-- Footer -->
<footer class="footer">
    <p class="footer-logo">NOCTURNE</p>
    <p class="footer-tagline">Discover Korea After Dark</p>
    <p class="footer-team">© 2026 Nocturne · Dohun Kwon · Gunwoo Kim · Kyounghun Oh</p>
    <p class="footer-contact">Contact: <a href="mailto:nocturne@mail.com">nocturne@mail.com</a></p>
</footer>
</body>
</html>
